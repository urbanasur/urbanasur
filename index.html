<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Urbana Sur FM</title>

<style>

body{

background:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.85)),
url("https://images.unsplash.com/photo-1598488035139-bdbb2231ce04")
center/cover no-repeat;

color:white;
font-family:Arial,Helvetica,sans-serif;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;
margin:0;

}


/* CAJA PRINCIPAL */

.player{

width:360px;

background:rgba(15,15,15,.92);

border:2px solid #cc0000;

border-radius:20px;

padding:25px;

text-align:center;

box-shadow:
0 0 25px red,
0 0 50px rgba(255,0,0,.5);

}



/* LOGO */

.logo{

font-size:32px;

font-weight:bold;

color:#ff2222;

text-shadow:0 0 15px red;

margin-bottom:15px;

}



/* EN VIVO */

.live{

display:inline-block;

background:#cc0000;

padding:8px 20px;

border-radius:20px;

font-weight:bold;

animation:parpadeo 1s infinite;

}


@keyframes parpadeo{

50%{

opacity:.4;

}

}



/* ECUALIZADOR */

.equalizer{

height:55px;

display:flex;

justify-content:center;

align-items:end;

gap:6px;

margin:20px;

}


.bar{

width:8px;

background:red;

animation:movimiento 1s infinite;

}


.bar:nth-child(1){height:20px;}
.bar:nth-child(2){height:45px;animation-delay:.2s;}
.bar:nth-child(3){height:30px;animation-delay:.4s;}
.bar:nth-child(4){height:55px;animation-delay:.6s;}
.bar:nth-child(5){height:35px;animation-delay:.8s;}


@keyframes movimiento{

50%{

transform:scaleY(.3);

}

}



/* REPRODUCTOR */

.radio{

margin-top:20px;

}



/* REDES */

.redes{

margin-top:25px;

}


.redes a{

display:block;

margin:12px;

text-decoration:none;

font-weight:bold;

}


.instagram{

color:#ff4b91;

}


.facebook{

color:#1877f2;

}


.youtube{

color:#ff0000;

}


</style>

</head>


<body>


<div class="player">


<div class="logo">

🎸 URBANA SUR FM

</div>


<div class="live">

🔴 EN VIVO

</div>


<div class="equalizer">

<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>

</div>


<h2>📻 Radio Online 24 Horas</h2>


<div class="radio">


<div class="cstrEmbed"
data-type="newStreamPlayer"
data-publicToken="743aea0d-2aef-435e-978a-baaf792348a5"
data-theme="dark">

</div>


</div>



<div class="redes">


<a class="instagram"
href="https://www.instagram.com/urbanasurchingolo/"
target="_blank">

📸 Instagram @urbanasurchingolo

</a>


<a class="facebook"
href="https://www.facebook.com/profile.php?id=61574009805190"
target="_blank">

👍 Facebook David Quinteros

</a>


<a class="youtube"
href="https://www.youtube.com/@urbanasur32"
target="_blank">

▶ YouTube @urbanasur32

</a>


</div>


</div>


<script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>


</body>

</html>
