<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Urbana Sur FM</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,Helvetica,sans-serif;
    background:
    linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.85)),
    url("https://images.unsplash.com/photo-1598488035139-bdbb2231ce04")
    center/cover no-repeat;
    color:#fff;
}

.player{
    width:380px;
    background:rgba(15,15,15,.92);
    border:2px solid #cc0000;
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 0 25px red;
}

h1{
    color:#ff2b2b;
    margin-top:0;
    text-shadow:0 0 10px red;
}

.live{
    display:inline-block;
    background:#cc0000;
    color:#fff;
    padding:8px 18px;
    border-radius:20px;
    font-weight:bold;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{opacity:.4;}
}

.eq{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:6px;
    height:60px;
    margin:20px 0;
}

.eq span{
    width:8px;
    background:#ff0000;
    border-radius:4px;
    animation:bars .8s infinite alternate;
}

.eq span:nth-child(1){height:20px;}
.eq span:nth-child(2){height:45px;animation-delay:.1s;}
.eq span:nth-child(3){height:30px;animation-delay:.2s;}
.eq span:nth-child(4){height:55px;animation-delay:.3s;}
.eq span:nth-child(5){height:25px;animation-delay:.4s;}

@keyframes bars{
    from{transform:scaleY(.4);}
    to{transform:scaleY(1);}
}

button{
    width:120px;
    padding:14px;
    margin:8px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
}

.play{
    background:#00aa00;
    color:#fff;
}

.stop{
    background:#cc0000;
    color:#fff;
}

.redes{
    margin-top:20px;
}

.redes a{
    display:block;
    margin:10px 0;
    text-decoration:none;
    font-weight:bold;
}

.instagram{color:#ff4b91;}
.facebook{color:#1877f2;}
.youtube{color:#ff0000;}
</style>
</head>

<body>

<div class="player">

<div class="live">🔴 EN VIVO</div>

<h1>🎸 URBANA SUR FM</h1>

<p>📻 Radio Online 24 Horas</p>

<div class="eq">
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
</div>

<button class="play" onclick="playRadio()">▶ PLAY</button>
<button class="stop" onclick="stopRadio()">■ STOP</button>

<audio id="radio" preload="none">
<source src="https://uk3freenew.listen2myradio.com/live.mp3?typeportmount=s1_18530_stream_94115581" type="audio/mpeg">
</audio>

<div class="redes">
<a class="instagram" href="https://www.instagram.com/urbanasurchingolo/" target="_blank">📸 Instagram @urbanasurchingolo</a>

<a class="facebook" href="https://www.facebook.com/profile.php?id=61574009805190" target="_blank">👍 Facebook David Quinteros</a>

<a class="youtube" href="https://www.youtube.com/@urbanasur32" target="_blank">▶ YouTube @urbanasur32</a>
</div>

</div>

<script>
const radio=document.getElementById("radio");

function playRadio(){
    radio.play().catch(e=>alert("No se pudo iniciar la reproducción: "+e));
}

function stopRadio(){
    radio.pause();
    radio.currentTime=0;
}
</script>

</body>
</html>
