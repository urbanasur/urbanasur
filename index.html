.player{

.logo{

font-size:34px;

.live{

background:#cc0000;

padding:8px 20px;

border-radius:20px;

font-weight:bold;

}



@keyframes parpadeo{

50%{
opacity:.4;
}

}



.equalizer{

height:60px;

display:flex;

justify-content:center;

align-items:end;

gap:7px;

margin:20px;

}


.bar{

width:9px;

background:red;

animation:audio 1s infinite;

}


.bar:nth-child(1){height:20px;}
.bar:nth-child(2){height:45px;animation-delay:.2s;}
.bar:nth-child(3){height:30px;animation-delay:.4s;}
.bar:nth-child(4){height:55px;animation-delay:.6s;}
.bar:nth-child(5){height:35px;animation-delay:.8s;}



@keyframes audio{

50%{
transform:scaleY(.3);
}

}



.radio{

margin-top:20px;

background:white;

border-radius:10px;

padding:10px;

}



/* REDES */
