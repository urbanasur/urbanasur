<title>Urbana Sur FM</title>

<style>

body{

margin:0;
min-height:100vh;

background:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.85)),
url("https://images.unsplash.com/photo-1598488035139-bdbb2231ce04")
center/cover no-repeat;

font-family:Arial,Helvetica,sans-serif;

display:flex;
justify-content:center;
align-items:center;

color:white;

}


.caja{

width:390px;

background:rgba(15,15,15,.93);

border:2px solid #cc0000;

border-radius:20px;

padding:25px;

text-align:center;

box-shadow:0 0 30px red;

}


.logo{

font-size:34px;

font-weight:bold;

color:#ff2222;

text-shadow:0 0 15px red;

}


.live{

display:inline-block;

margin-top:15px;

background:red;

padding:8px 20px;

border-radius:20px;

font-weight:bold;

animation:parpadeo 1s infinite;

}


@keyframes parpadeo{

50%{
opacity:.4;
}

}



.ecualizador{

height:60px;

display:flex;

justify-content:center;

align-items:end;

gap:6px;

margin:20px;

}


.ecualizador span{

width:8px;

background:red;

animation:movimiento 1s infinite;

}


.ecualizador span:nth-child(1){height:20px;}
.ecualizador span:nth-child(2){height:50px;}
.ecualizador span:nth-child(3){height:35px;}
.ecualizador span:nth-child(4){height:55px;}
.ecualizador span:nth-child(5){height:25px;}



@keyframes movimiento{

50%{

transform:scaleY(.3);

}

}



.radio{

background:white;

border-radius:10px;

padding:10px;

margin-top:15px;

}


.redes{

margin-top:25px;

}


.redes a{

display:block;

margin:12px;

font-weight:bold;

text-decoration:none;

}


.instagram{

color:#ff4b91;

}


.facebook{

color:#1877f2;

}


.youtube{

color:#ff0000;

}


</style>


</head>



<body>
