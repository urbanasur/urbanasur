<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Urbana Sur FM</title>

<style>

body{
margin:0;
height:100vh;

background:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.85)),
url("https://images.unsplash.com/photo-1598488035139-bdbb2231ce04")
center/cover;

font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
color:white;
}


.caja{

width:380px;
background:#111;
padding:25px;
border-radius:20px;
border:2px solid red;
text-align:center;
box-shadow:0 0 30px red;

}


h1{

color:#ff2222;
text-shadow:0 0 10px red;

}


.live{

background:red;
padding:8px 20px;
border-radius:20px;
display:inline-block;
animation:parpadeo 1s infinite;

}


@keyframes parpadeo{

50%{opacity:.4;}

}



button{

padding:15px 35px;
font-size:20px;
font-weight:bold;
border:0;
border-radius:10px;
cursor:pointer;
background:#00aa00;
color:white;
margin:20px;

}



.eq span{

display:inline-block;
width:8px;
height:35px;
background:red;
margin:4px;
animation:audio 1s infinite;

}


@keyframes audio{

50%{height:10px;}

}



a{

display:block;
margin:12px;
text-decoration:none;
font-weight:bold;

}


.instagram{color:#ff4b91;}
.facebook{color:#1877f2;}
.youtube{color:red;}

</style>

</head>


<body>


<div class="caja">


<h1>🎸 URBANA SUR FM</h1>

<h2>📻 Radio Online 24 Horas</h2>


<div class="eq">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>


<button onclick="playRadio()">

▶ PLAY

</button>

<audio id="radio">

<source src="https://sapircast.caster.fm:19235/vV9Du?token=31f177849cb0bb3341f4e7d8761f9798" type="audio/mpeg">

<a class="instagram" href="https://www.instagram.com/urbanasurchingolo/" target="_blank">

<a class="youtube" href="https://www.youtube.com/@urbanasur32" target="_blank">
▶ YouTube @urbanasur32
</a>


</div>



<script>

let radio=document.getElementById("radio");


function playRadio(){

radio.play();

}


function stopRadio(){

radio.pause();

radio.currentTime=0;

}

</script>

</html>
