<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Urbana Sur FM</title>

<style>

body{
margin:0;
min-height:100vh;

background:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.85)),
url("https://images.unsplash.com/photo-1598488035139-bdbb2231ce04")
center/cover no-repeat;

font-family:Arial,Helvetica,sans-serif;

display:flex;
justify-content:center;
align-items:center;

color:white;
}


.player{

width:380px;

background:rgba(15,15,15,.92);

border:2px solid #cc0000;

border-radius:20px;

padding:25px;

text-align:center;

box-shadow:0 0 25px red;

}


.logo{

font-size:34px;

font-weight:bold;

color:#ff2222;

text-shadow:0 0 15px red;

}


.live{

display:inline-block;

margin-top:15px;

background:#cc0000;

padding:8px 20px;

border-radius:20px;

font-weight:bold;

animation:parpadeo 1s infinite;

}


@keyframes parpadeo{

50%{
opacity:.4;
}

}



.equalizer{

display:flex;

justify-content:center;

align-items:end;

gap:6px;

height:60px;

margin:20px;

}


.bar{

width:8px;

background:red;

animation:audio 1s infinite;

}


.bar:nth-child(1){height:20px;}
.bar:nth-child(2){height:45px;animation-delay:.2s;}
.bar:nth-child(3){height:30px;animation-delay:.4s;}
.bar:nth-child(4){height:55px;animation-delay:.6s;}
.bar:nth-child(5){height:35px;animation-delay:.8s;}



@keyframes audio{

50%{
transform:scaleY(.3);
}

}



.radio{

margin-top:20px;

}


/* redes */

.redes{

margin-top:25px;

}


.redes a{

display:block;

margin:12px;

text-decoration:none;

font-weight:bold;

}


.instagram{
color:#ff4b91;
}


.facebook{
color:#1877f2;
}


.youtube{
color:#ff0000;
}


</style>

</head>


<body>


<div class="player">


<div class="logo">
🎸 URBANA SUR FM
</div>


<div class="live">
🔴 EN VIVO
</div>


<div class="equalizer">

<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>

</div>
